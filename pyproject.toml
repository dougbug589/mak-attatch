[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mak-attatch"
version = "1.3.5"
description = "Attach TMDB cover art posters to video files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.28",
    "guessit>=3.7",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
tui = ["textual>=0.50"]

[project.scripts]
mak-attatch-cli = "mak_attatch.cli:main"
mak-attatch-tui = "mak_attatch.poster_tui:main"

[project.gui-scripts]
mak-attatch = "mak_attatch.main:main"

[project.urls]
Homepage = "https://github.com/dougbug589/mak-attatch"
Issues = "https://github.com/dougbug589/mak-attatch/issues"

# Everything lives under one namespace. Installing generic top-level modules
# (config, cli, main, core, ui) used to overwrite or shadow other packages.
[tool.setuptools.packages.find]
include = ["mak_attatch*"]

[tool.setuptools.package-data]
mak_attatch = ["assets/*.png"]

[tool.bandit]
# Shelling out to media tools (ffmpeg/mkvpropedit/ffprobe/yazi/chafa) is this
# app's core function. Binaries are validated up front by
# core.attacher.check_tools() and always called with argument lists, never
# shell=True. xml.etree.ElementTree is used only to *generate* metadata XML
# for mkvpropedit; it never parses untrusted input. These are intentional,
# so the subprocess/XML heuristics are excluded repo-wide. Silent-exception
# sites (B110) are annotated inline where they are deliberate.
skips = ["B404", "B603", "B607", "B405"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F/I + the blind-except rules: all `except Exception`/`except:` sites
# were narrowed in the v1.2.0 cleanup; keep them enforced.
select = ["E", "F", "I", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
