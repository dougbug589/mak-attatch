name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; no job needs to write.
permissions:
  contents: read

# Actions are pinned to release commits; Dependabot (github-actions) bumps them.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix
      - name: Install Python dependencies (latest core deps)
        run: |
          pip install pytest requests guessit
      - name: Run tests
        run: |
          python -m pytest tests/ -q

  gui-tui:
    # Installs the exact pins from requirements.txt, so Dependabot bumps of
    # PyQt6/textual/requests/guessit are tested before they are merged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          # Runner images can ship a Microsoft apt source that returns 403.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure*
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install pinned Python dependencies
        run: |
          pip install -r requirements.txt pytest
      - name: Run full suite including GUI/TUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q

  wheel:
    # Tests what pip actually ships, not just the source tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Only the mak_attatch namespace is installed, with its assets
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          tops = {n.split("/")[0] for n in names}
          assert all(t == "mak_attatch" or t.endswith(".dist-info") for t in tops), tops
          assert "mak_attatch/assets/logo.png" in names
          assert "mak_attatch/assets/icon.png" in names
          print("wheel top-level:", sorted(tops))
          EOF
      - name: Install into a clean venv and run the entry points
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/mak-attatch-cli --version
          # Without the [gui]/[tui] extras these must explain, not crash.
          ! /tmp/clean/bin/mak-attatch-tui 2> tui.err
          grep -q "mak-attatch\[tui\]" tui.err
          ! /tmp/clean/bin/mak-attatch 2> gui.err
          grep -q "mak-attatch\[gui\]" gui.err

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .
      - name: Run shellcheck
        run: shellcheck setup.sh convert.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit==1.9.4
      - name: Run bandit security scan
        run: bandit -c pyproject.toml -r mak_attatch main.py cli.py -q
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Run pip-audit vulnerability scan
        run: pip-audit -r requirements.txt
